  <!-- Docsify加载体 -->
  <div id="app" style="line-height:800px; font-size:30px" align="center" vertical-align="middle">加载中</div>
  <!-- Docsify初始化 -->
  <script>
    window.$docsify = {
      name: 'BVN API',
      repo: 'https://github.com/diazynez',
      plugins: [function (hook) {
        hook.afterEach(function (html) {
          var template = document.createElement('template');
          template.innerHTML = html;
          var content = template.content;
          content.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(function (heading) {
            if (heading.querySelector('.version-badge, .scope-badge')) return;
            var text = document.createTreeWalker(heading, NodeFilter.SHOW_TEXT).nextNode();
            var match = text && text.textContent.match(/^\s*(3\.\d+(?:开发)?\s*增加|正常模式专用|FVO专用)\s+/);
            if (!match) return;
            var badge = document.createElement('span');
            badge.className = /专用$/.test(match[1]) ? 'scope-badge' : 'version-badge';
            badge.textContent = match[1].replace(/\s/g, '');
            // Decorate compiled HTML before insertion, preserving existing heading IDs
            text.textContent = text.textContent.slice(match[0].length);
            text.parentNode.appendChild(badge);
          });
          content.querySelectorAll('p').forEach(function (paragraph) {
            Array.from(paragraph.childNodes).forEach(function (text) {
              if (text.nodeType !== Node.TEXT_NODE) return;
              var match = text.textContent.match(/^(\s*(?:传入参数|返回类型|类型))[（(](3\.\d+(?:开发)?)[）)](?=\s*[：:])/);
              if (!match) return;
              var badge = document.createElement('span');
              badge.className = 'version-badge';
              badge.textContent = match[2];
              text.replaceWith(document.createTextNode(match[1]), badge,
                document.createTextNode(text.textContent.slice(match[0].length)));
            });
          });
          return template.innerHTML;
        });
      }],
      logo: 'assets/bvn-icon-base.png',
	  	coverpage:  ['/', '/zh-cn/', '/en-us/', '/vi-vn/', '/it-it/'],
	  	loadNavbar: false,
	  	loadSidebar: true,
		  notFoundPage: {
				'/': '_404.md',
				'/zh-cn/': '_404.md',
				'/en-us/': 'en-us/_404.md',
				'/vi-vn/': 'vi-vn/_404.md',
				'/it-it/': 'it-it/_404.md'
			  },
		  autoHeader: true,
		  auto2top: true,
		  mergeNavbar: true,
		  formatUpdated: '{MM}/{DD} {HH}:{mm}',
		  search: {
				maxAge: 86400000, // 过期时间，单位毫秒，默认一天
				paths: 'auto',
				placeholder: {
					'/': '搜索',
					'/zh-cn/': '搜索',
					'/en-us/': 'Type to search',
					'/vi-vn/': 'Nhập để tìm kiếm',
					'/it-it/': 'Digita per cercare'
				},
				noData: {
					'/': '找不到结果',
					'/zh-cn/': '找不到结果',
					'/en-us/': 'No Results',
					'/vi-vn/': 'Ko có kết quả',
					'/it-it/': 'Nessun risultato'
				},
				depth: Infinity,
				hideOtherSidebarContent: false, // 是否隐藏其他侧边栏内容
				pathNamespaces: ['/', '/zh-cn/', '/en-us/', '/vi-vn/', '/it-it/']
			  }
    }
  </script>
